name: Universal GCC 16 Build Pipeline (Android/Termux)

on:
  push:
    branches: [ main ]
    tags:[ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Extract via Scratch
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Export Artifacts
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          # MAGIC: Dumps the / folder of the 'scratch' image to the runner's ./artifacts folder
          outputs: type=local,dest=artifacts
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gcc-ndk29-cache:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/gcc-ndk29-cache:buildcache,mode=max

      - name: Upload Artifacts (Action)
        uses: actions/upload-artifact@v7
        with:
          name: termux-gcc-16.1.0-package
          path: artifacts/*
          retention-days: 7

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: artifacts/*
          tag_name: "v16.1.0-ndk29"
          name: "GCC 16.1.0 Universal Termux Build (NDK 29)"
          body: "Automated, heavily-patched production build of the GCC 16.1.0 stable release for Android API 24. Extracted securely via Docker Scratch."
          draft: false
          prerelease: false
